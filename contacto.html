</head>
<body class="contacto">
    <header>
              <!-- Menú de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">

            <!-- Logo o nombre -->
            <a class="navbar-brand" href="#">Mi Web</a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Opciones del menú -->
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./servicios.html">Servicios</a>

                        <a class="nav-link" href="./contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    </header>

    <main>

        
<h2>🕵️ Formulario de agentes secretos</h2>

<form>

    <label for="nombre">Nombre en clave:</label><br>
    <input type="text" id="nombre" name="nombre" placeholder="Agente 007" required>

    <label for="email">Correo secreto:</label><br>
    <input type="email" id="email" name="email" placeholder="agente@email.com" required>

    <label for="mision">Tipo de misión:</label><br>
    <select id="mision" name="mision">
        <option>Infiltración</option>
        <option>Vigilancia</option>
        <option>Protección</option>
        <option>Descanso en un refugio</option>
    </select>

    <label for="alojamiento">Alojamiento elegido:</label><br>
    <select id="alojamiento" name="alojamiento">
        <option>El Búnker</option>
        <option>Piso Encubierto</option>
        <option>La Cabaña Fantasma</option>
        <option>Villa Horizonte</option>
        <option>Suite Mirage</option>
    </select>

    <label for="mensaje">Mensaje confidencial:</label><br>
    <textarea id="mensaje" name="mensaje" rows="4"
              placeholder="Escribe tu mensaje..."></textarea>

    <input type="checkbox" id="privacidad" required>
    <label for="privacidad">Acepto la política de privacidad.</label>

    <button type="submit">Enviar misión</button>

</form>
    </main>
</body>
</html>
